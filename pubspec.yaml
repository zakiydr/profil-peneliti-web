name: profile_peneliti
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  responsive_framework: ^1.5.1
  url_launcher: ^6.3.1
  provider: ^6.1.2
  universal_io: ^2.2.2
  google_fonts: ^5.1.0
  fl_chart: ^0.69.0
  intl: ^0.19.0
  dio: ^5.7.0
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  shared_preferences: ^2.3.2
  infinite_scroll_pagination: ^4.1.0
  loading_animation_widget: ^1.3.0
  dyn_mouse_scroll: ^1.0.7
  flutter_app_badge: ^2.0.2
  flutter_local_notifications: ^18.0.1
  # shared_preferences_web: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/images/
    - assets/fonts/Inter/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter/Inter-ExtraBold.ttf
          weight: 800